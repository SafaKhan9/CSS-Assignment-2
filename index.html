<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Airmax - Men's Sneakers</title>

    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        
        <div class="product-image">

            
            <div class="orange-shape"></div>

            
            <img src="sneaker.png.png" alt=" Men's Sneaker">

        
            <div class="arrows">
                <span>←</span>
                <span>→</span>
            </div>

        </div>


        
        <div class="product-info">

            
            <div class="header">

                <h2>Airmax</h2>

                <div class="icons">
                    <span>⌕</span>
                    <span>♟</span>
                    <span>🛒</span>
                </div>

            </div>


            
            <p class="collection">Winter Collection</p>

            <h1>Men Black Sneakers</h1>


            
            <div class="price">
                <span class="current-price">$150</span>
                <span class="old-price">$200</span>
            </div>


            
            <div class="option">
                <p>SIZE</p>

                <div class="sizes">
                    <span>7</span>
                    <span>8</span>
                    <span>9</span>
                    <span>10</span>
                    <span>11</span>
                </div>
            </div>


            
            <div class="option color-option">
                <p>COLOR</p>

                <div class="colors">
                    <span class="color yellow"></span>
                    <span class="color black"></span>
                    <span class="color blue"></span>
                </div>
            </div>


            
            <div class="buttons">

                <button>
                    🛍️ &nbsp; Buy Now
                </button>

                <button>
                    🛒 &nbsp; Add To Cart
                </button>

            </div>

        </div>

    </div>

</body>
</html>
